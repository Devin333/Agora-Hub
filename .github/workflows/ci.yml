name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Compile modules
        run: python -m scripts.dev compile

      - name: Run Graph runtime contract tests
        run: python -m scripts.dev test-graph-runtime-contracts

      - name: Run Graph domain tests
        run: python -m scripts.dev test-graph-domain

      - name: Run service tests
        run: python -m scripts.dev test-services

      - name: Run offline RAG diagnostic gate
        run: python -m scripts.dev test-rag-eval-gate

      - name: Run offline RAG evaluation protocol contracts
        run: python -m scripts.dev test-rag-eval-contracts

      - name: Upload offline RAG protocol test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-protocol-fixture-contracts
          path: .newsroom/eval/protocol-contracts
          if-no-files-found: warn

      - name: Run PRD-aligned daily regression sweep
        run: python -m scripts.dev test-prd-daily

      - name: Run durable event compatibility gate
        run: python -m pytest tests/infrastructure/storage/events/test_durable_event_compatibility_release.py -q

      - name: Run fixed smoke commands
        run: python -m scripts.dev smoke
