name: Images

# Publishes the api and web images every deployment mode runs: the hosted
# compose stack, self-hosted servers and the desktop app's local stack.
#
#   push to main      -> edge, sha-<short>
#   tag v<x.y.z>      -> v<x.y.z>, sha-<short>
#
# Both images are built for linux/amd64 and linux/arm64 and pushed to GHCR.
# They are pushed to Alibaba Cloud ACR as well when the repository defines the
# ACR_REGISTRY and ACR_NAMESPACE variables and the ACR_USERNAME and
# ACR_PASSWORD secrets; pulls from mainland China are much faster there.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [agora-api, agora-web]
        include:
          - image: agora-api
            dockerfile: deploy/hosted/api.Dockerfile
          - image: agora-web
            dockerfile: deploy/hosted/web.Dockerfile

    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      ACR_IMAGE: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.image }}
      PUSH: ${{ github.event_name != 'pull_request' }}
      PUSH_ACR: ${{ github.event_name != 'pull_request' && vars.ACR_REGISTRY != '' && vars.ACR_NAMESPACE != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lower-case the GHCR path
        # Image references must be lower case; the owner name may not be.
        run: echo "GHCR_IMAGE=${GHCR_IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud ACR
        if: env.PUSH_ACR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Image names
        id: names
        run: |
          {
            echo "images<<EOF"
            echo "$GHCR_IMAGE"
            if [ "$PUSH_ACR" = "true" ]; then echo "$ACR_IMAGE"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-

      - name: Release name baked into the image
        id: release
        # The web image reports it to the desktop app, which opens a local
        # stack only when it runs the release the app expects.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AGORA_IMAGE_TAG=${{ steps.release.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
