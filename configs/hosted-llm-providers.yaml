# Model providers a hosted account may choose for its own API key.
#
# Users pick a provider and one of its models; they never submit a base URL,
# so keys are only ever sent to the endpoints listed here. Every model must
# fit the research request budget (NEWS_RESEARCH_LLM_MAX_INPUT_TOKENS plus
# NEWS_RESEARCH_LLM_MAX_OUTPUT_TOKENS); the API refuses to start otherwise.
#
# Sources (checked 2026-10-28):
#   DashScope: the live model list (GET /compatible-mode/v1/models) serves
#   deepseek-v4.1-flash and deepseek-v4-pro; deepseek-v4-flash answers
#   model_not_found.
#   DeepSeek: https://api-docs.deepseek.com/quick_start/pricing names the
#   models deepseek-flash (DeepSeek-V4.1-Flash-1017) and deepseek-v4-pro, both
#   with a 1M-token context; deepseek-v4-flash is a retired legacy alias.
schema_version: hosted-llm-providers.v1
providers:
  - id: dashscope
    label: 阿里云百炼（DashScope）
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: deepseek-v4.1-flash
    models:
      - id: deepseek-v4.1-flash
        label: DeepSeek V4.1 Flash
        context_window_tokens: 1000000
      - id: deepseek-v4-pro
        label: DeepSeek V4 Pro
        context_window_tokens: 1000000
  - id: deepseek
    label: DeepSeek 官方
    base_url: https://api.deepseek.com
    default_model: deepseek-flash
    models:
      - id: deepseek-flash
        label: DeepSeek V4.1 Flash
        context_window_tokens: 1000000
      - id: deepseek-v4-pro
        label: DeepSeek V4 Pro
        context_window_tokens: 1000000
