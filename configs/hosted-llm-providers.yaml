# Model providers a hosted account may choose for its own API key.
#
# Users pick a provider and one of its models; they never submit a base URL,
# so keys are only ever sent to the endpoints listed here. Every model must
# fit the research request budget (NEWS_RESEARCH_LLM_MAX_INPUT_TOKENS plus
# NEWS_RESEARCH_LLM_MAX_OUTPUT_TOKENS); the API refuses to start otherwise.
#
# Sources (checked 2026-10-27):
#   https://help.aliyun.com/zh/model-studio/deepseek-v4-flash
#   https://api-docs.deepseek.com/news/news260424/
schema_version: hosted-llm-providers.v1
providers:
  - id: dashscope
    label: 阿里云百炼（DashScope）
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    default_model: deepseek-v4-flash
    models:
      - id: deepseek-v4-flash
        label: DeepSeek V4 Flash
        context_window_tokens: 1000000
  - id: deepseek
    label: DeepSeek 官方
    base_url: https://api.deepseek.com
    default_model: deepseek-v4-flash
    models:
      - id: deepseek-v4-flash
        label: DeepSeek V4 Flash
        context_window_tokens: 1000000
      - id: deepseek-v4-pro
        label: DeepSeek V4 Pro
        context_window_tokens: 1000000
