model_groups:
  research-desktop-answer:
    deployments:
      - deployment_id: research-desktop-answer-gpt-5.6-sol
        provider: openai-compatible
        provider_name: openai-compatible
        model: gpt-5.6-sol
        api_base: ${NEWS_RESEARCH_LLM_BASE_URL}
        api_key_env: OPENAI_API_KEY
        timeout_seconds: 90
        max_retries: 1
        # The gateway does not publish model windows; 128k is the operator-confirmed
        # window (inputs above 200k tokens were accepted in a 2026-10-27 probe).
        capabilities:
          context_window_tokens: 128000

  writer-primary:
    deployments:
      - deployment_id: dashscope-deepseek-v4-flash
        provider: openai-compatible
        provider_name: dashscope
        model: deepseek-v4-flash
        api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
        api_key: ${DASHSCOPE_API_KEY}
        timeout_seconds: 90
        max_retries: 2
        capabilities:
          supports_streaming: true
          supports_tool_calling: true
          supports_structured_output: false
          supports_multimodal_input: false
          supports_prompt_cache: true
          context_window_tokens: 1000000
          max_output_tokens: 393216
        structured_output_capability:
          mode: none
          supported_keywords: []
          supports_local_refs: false
          supports_json_object_fallback: false
          supports_stream_terminal_validation: false
          revision: dashscope-deepseek-v4-flash-unqualified-v1
        # Physical limits: https://help.aliyun.com/zh/model-studio/deepseek-v4-flash
        context_profile:
          default_output_tokens: 2048
          tokenizer_family: dashscope-deepseek-v4
          tokenizer_revision: byte-fallback-2026-08-11
          normalizer_revision: openai-chat-completions-v1
          profile_revision: dashscope-deepseek-v4-flash-2026-08-11
          operational_input_fraction: 0.9
          safety_margin_tokens: 4096
          allow_conservative_fallback: true
          provider_auto_truncation: false

routes:
  research-desktop-answer:
    model_group: research-desktop-answer
  daily-intelligence-writer:
    model_group: writer-primary
  writer-primary:
    model_group: writer-primary

embeddings: {}
pricing: {}
