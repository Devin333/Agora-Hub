# Hosted Agora paper agent: Caddy (HTTPS) -> web (Next BFF) -> api (FastAPI).
# Run from this directory after creating .env (install.sh does both):
#   docker compose pull && docker compose up -d --wait
# To build the images from a source checkout instead of pulling them:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
name: agora

x-api-environment: &api-environment
  NEWSROOM_DEPLOYMENT_PROFILE: hosted
  NEWSROOM_PUBLIC_ORIGIN: https://${NEWSROOM_DOMAIN:?set NEWSROOM_DOMAIN in .env}
  # Only the web container talks to the API; its forwarded address chain is
  # trusted, nothing else's.
  NEWSROOM_TRUSTED_PROXY_CIDRS: ${AGORA_WEB_IP:-172.30.10.20}/32
  NEWSROOM_LLM_CREDENTIAL_MODE: invocation
  NEWSROOM_CREDENTIAL_ENCRYPTION_KEY: ${NEWSROOM_CREDENTIAL_ENCRYPTION_KEY:?set NEWSROOM_CREDENTIAL_ENCRYPTION_KEY in .env}
  NEWS_ACTIVITY_ENCRYPTION_KEY: ${NEWS_ACTIVITY_ENCRYPTION_KEY:?set NEWS_ACTIVITY_ENCRYPTION_KEY in .env}
  NEWSROOM_HOSTED_LOGIN_RATE_LIMIT_PER_MINUTE: ${NEWSROOM_HOSTED_LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  NEWSROOM_HOSTED_RESEARCH_RATE_LIMIT_PER_MINUTE: ${NEWSROOM_HOSTED_RESEARCH_RATE_LIMIT_PER_MINUTE:-30}
  # Marker needs a Docker daemon; the API container parses PDFs in process.
  NEWS_RESEARCH_PARSER_BACKENDS: pymupdf
  NEWSROOM_PDF_PARSER_CASCADE: pymupdf
  # The hosted reader never reranks and the image has no model runtime, so
  # there is nothing to warm.
  NEWS_PRELOAD_RERANKER: "0"

services:
  api:
    image: ${AGORA_IMAGE_REGISTRY:-ghcr.io/devin333}/agora-api:${AGORA_IMAGE_TAG:-edge}
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - newsroom-data:/app/.newsroom
    networks:
      app:
        ipv4_address: ${AGORA_API_IP:-172.30.10.10}
    # Lets in-flight research requests finish before the process is stopped.
    stop_grace_period: 60s

  web:
    image: ${AGORA_IMAGE_REGISTRY:-ghcr.io/devin333}/agora-web:${AGORA_IMAGE_TAG:-edge}
    restart: unless-stopped
    environment:
      NEWSROOM_PUBLIC_ORIGIN: https://${NEWSROOM_DOMAIN:?set NEWSROOM_DOMAIN in .env}
      NEWSROOM_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      app:
        ipv4_address: ${AGORA_WEB_IP:-172.30.10.20}
      edge: {}
    stop_grace_period: 30s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      NEWSROOM_DOMAIN: ${NEWSROOM_DOMAIN:?set NEWSROOM_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge

networks:
  # api and web only. Nothing here is published, so the API is never reachable
  # from outside; the web address is the trusted proxy above. Change the subnet
  # and both addresses together when 172.30.10.0/24 is already in use.
  app:
    ipam:
      config:
        - subnet: ${AGORA_APP_SUBNET:-172.30.10.0/24}
  # web and caddy only, so the web server is reachable solely through Caddy.
  edge: {}

volumes:
  newsroom-data:
  caddy-data:
  caddy-config:
