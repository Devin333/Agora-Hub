<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agora Paper Agent</title>
  <link rel="stylesheet" href="./startup.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><span></span><span></span></div>
      <p class="eyebrow">Agora Paper Agent</p>
      <h1 id="title">正在启动论文工作台</h1>
      <p id="message" class="message">正在核对本机运行身份与服务状态。不会自动发送模型请求。</p>
      <div id="status" class="status" role="status" aria-live="polite">准备中</div>
      <section id="clear-panel" class="clear-panel" aria-labelledby="clear-heading" hidden>
        <h2 id="clear-heading">受控清除恢复</h2>
        <p id="clear-explanation" class="clear-explanation"></p>
        <label for="clear-confirmation">固定确认短语</label>
        <input id="clear-confirmation" type="text" autocomplete="off" spellcheck="false" aria-describedby="clear-explanation">
        <div class="actions">
          <button id="clear-preview" type="button">重新预览清理状态</button>
          <button id="clear-apply" type="button" disabled>清除并退出</button>
          <button id="clear-refresh" type="button">检查状态</button>
        </div>
      </section>
      <div class="actions">
        <button id="retry" type="button" hidden>重试</button>
        <button id="details" type="button">查看安全诊断</button>
      </div>
      <pre id="diagnostics" hidden></pre>
    </section>
  </main>
  <script src="./startup.js"></script>
</body>
</html>
