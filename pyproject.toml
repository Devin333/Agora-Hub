[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-hub"
version = "0.1.0"
description = "Evidence-driven intelligence hub for news, research papers, and projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agora Hub" }]
dependencies = [
  "Authlib>=1.3.2,<2.0",
  "cryptography>=42.0",
  "email-validator>=2.2",
  "jsonschema>=4.0",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0.1",
  "pydantic>=2.6",
  "phonenumbers>=8.13",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Devin333/Agora-Hub"
Repository = "https://github.com/Devin333/Agora-Hub"
Issues = "https://github.com/Devin333/Agora-Hub/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
postgres = [
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
]
redis = [
  "redis>=5.0",
]
qdrant = [
  "qdrant-client>=1.8",
]
rerank = [
  "sentence-transformers>=3.0",
]
observability = [
  "opentelemetry-api>=1.25",
]
vision = [
  "Pillow>=10.0",
  "sentence-transformers>=3.0",
]
ocr = [
  # Provides the `nougat` CLI used by backend.research.document.pdf_compiler.
  "nougat-ocr==0.1.17",
]
dev = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "Pillow>=10.0",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "opentelemetry-api>=1.25",
  "uvicorn[standard]>=0.27",
]
all = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "Pillow>=10.0",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "opentelemetry-api>=1.25",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
news = "interfaces.cli.news:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "framework*",
  "backend*",
  "interfaces*",
  "infrastructure*",
]
exclude = [
  "tests*",
  "docs*",
  "scripts*",
  "openspec*",
]

[tool.setuptools.package-data]
"backend.foundation" = [
  "skills/**/*.md",
  "skills/**/*.json",
  "skills/**/*.yaml",
  "skills/**/*.yml",
]
"infrastructure.storage.postgres" = [
  "migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
addopts = ["--import-mode=importlib", "-m", "not live_research_e2e"]
markers = [
  "live_research_e2e: opt-in live arXiv and LLM production-composition coverage; select explicitly with valid credentials",
  "redis_integration: opt-in isolated Redis integration coverage; select explicitly with a dedicated test URL",
]

[tool.pyright]
extraPaths = ["sdk/python"]
