[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-hub"
version = "0.1.0"
description = "Evidence-driven intelligence hub for news, research papers, and projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agora Hub" }]
dependencies = [
  "Authlib>=1.3.2,<2.0",
  "cryptography>=42.0",
  "email-validator>=2.2",
  "jsonschema>=4.0",
  # Paper figures are validated and re-encoded on every parse path.
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0.1",
  "pydantic>=2.6",
  "phonenumbers>=8.13",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Devin333/Agora-Hub"
Repository = "https://github.com/Devin333/Agora-Hub"
Issues = "https://github.com/Devin333/Agora-Hub/issues"

[project.optional-dependencies]
api = [
  # Native client for account connections that speak the Anthropic Messages API.
  "anthropic>=2.3,<3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
postgres = [
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
]
redis = [
  "redis>=5.0",
]
qdrant = [
  "qdrant-client>=1.8",
]
rerank = [
  "sentence-transformers>=3.0",
]
observability = [
  "opentelemetry-api>=1.25",
]
vision = [
  "sentence-transformers>=3.0",
]
ocr = [
  # Provides the `nougat` CLI used by backend.research.document.pdf_compiler.
  "nougat-ocr==0.1.17",
]
qasper-eval = [
  "numpy>=1.26,<3.0",
]
rag-eval-judge = [
  # Exact compatibility lock mirrored in requirements/rag-eval-judge-0.4.3.txt.
  "ragas==0.4.3",
  "langchain==0.3.27",
  "langchain-core==0.3.79",
  "langchain-community==0.3.31",
  "langchain-openai==0.3.35",
  "langchain-text-splitters==0.3.11",
  "instructor==1.3.2",
  "openai==1.109.1",
]
dev = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "opentelemetry-api>=1.25",
  "uvicorn[standard]>=0.27",
]
all = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "pytest>=8.0",
  "qdrant-client>=1.8",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "opentelemetry-api>=1.25",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
news = "interfaces.cli.news:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "framework*",
  "backend*",
  "interfaces*",
  "infrastructure*",
]
exclude = [
  "tests*",
  "docs*",
  "scripts*",
  "openspec*",
]

[tool.setuptools.package-data]
"backend.foundation" = [
  "skills/**/*.md",
  "skills/**/*.json",
  "skills/**/*.yaml",
  "skills/**/*.yml",
]
"infrastructure.storage.postgres" = [
  "migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
addopts = ["--import-mode=importlib", "-m", "not live_research_e2e and not tool_stress and not tool_live"]
markers = [
  "live_research_e2e: opt-in live arXiv and LLM production-composition coverage; select explicitly with valid credentials",
  "redis_integration: opt-in isolated Redis integration coverage; select explicitly with a dedicated test URL",
  "tool_scenario(tool, *dimensions): claims tool stability coverage; checked by tests/tools/test_tool_contracts.py",
  "leak_grace(seconds): extend how long the tool resource-leak guard waits for stragglers",
  "tool_stress: opt-in tool concurrency and soak runs; select with python -m scripts.dev tool-stability",
  "tool_live: opt-in tool runs against real external services; needs NEWS_TOOL_LIVE_TESTS=1 and credentials",
]

[tool.pyright]
extraPaths = ["sdk/python"]
